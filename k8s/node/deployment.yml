apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
  namespace: ingress-namespace
  labels:
    app: node-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-docker-k8s-container
          image: rayyan12311/node-server:basic
          ports:
            - containerPort: 3333